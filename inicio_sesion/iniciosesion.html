<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../css/stylelogin.css">
</head>
<body>
    <video class="video-fondo" autoplay muted loop playsinline>
      <source src="../../imagenes/Video Project.mp4" type="video/mp4">
  </video>
   <header class="inicio" id="inicio">
    

    <button id="btn-menu" class="btn-menu" type="button" aria-expanded="false" aria-controls="menu">☰</button>
      <nav id="menu" aria-label="Menú principal" aria-hidden="true">
        <a href="../index.html">Inicio</a>
        <a href="../servicios/servicios.html">Servicios</a>

<h1>Iniciar sesión</h1>
  </header>

    <main>
        <div class="login">

            <img class="logo" src="../imagenes/logo.png" alt="Logo de Arsidev">

        <form class="login-form" action="#" method="post">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>
            <br>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Entrar</button>
            <br>
        </form>
        <br>
        <p><a href="#">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
    </main>
    <script src="../js/menu.js"></script>
</body>
</html>
