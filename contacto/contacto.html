</head>
<body>
  <video class="video-fondo" autoplay muted loop playsinline>
    <source src="../imagenes/Video Project.mp4" type="video/mp4">
  </video>

  <header class="inicio" id="inicio">
    <nav class="nav" aria-label="Menú principal">
      <div class="nav-izq">

  </header>

  <h1 class="title">Contacto</h1>

  <main>
    <!-- EDITA: el texto de arriba del formulario -->
    <form class="formulario" action="#" method="post">
      <p>Cuéntanos qué necesitas y te respondemos pronto.</p>

      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" required>

      <label for="correo">Correo</label>
      <input id="correo" name="correo" type="email" required>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>
